<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="MediLink Offline: An Offline-First Secure Patient Referral Handoff System Using Encrypted QR Codes" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <title>MediLink Offline | Secure Patient Referral Handoff</title>

    <!-- Tailwind CSS with Official MediLink Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              medgreen: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                300: '#86efac',
                400: '#4ade80',
                500: '#22c55e',
                600: '#16a34a',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
                950: '#022c22',
              },
              medteal: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
              },
              clinical: {
                bg: '#f8fafc',
                card: '#ffffff',
                border: '#e2e8f0',
                subtle: '#64748b',
                text: '#0f172a',
              },
              emergency: {
                50: '#fef2f2',
                100: '#fee2e2',
                500: '#ef4444',
                600: '#dc2626',
                700: '#b91c1c',
              }
            },
            boxShadow: {
              card: '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)'
            }
          }
        }
      };
    </script>
    <style>
      .clinical-card {
        background-color: #ffffff;
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 0.5rem;
        padding: 1.25rem;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      }
      .data-table-th {
        padding: 0.75rem 1rem;
        text-align: left;
        font-size: 0.75rem;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background-color: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
      }
      .data-table-td {
        padding: 0.875rem 1rem;
        font-size: 0.875rem;
        color: #334155;
        border-bottom: 1px solid #f1f5f9;
        white-space: nowrap;
      }
      .input-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.375rem;
      }
      .input-field {
        width: 100%;
        border-radius: 0.375rem;
        border: 1px solid #cbd5e1;
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
        color: #0f172a;
        background-color: #ffffff;
        outline: none;
        transition: border-color 0.15s ease-in-out;
      }
      .input-field:focus {
        border-color: #047857;
        box-shadow: 0 0 0 1px #047857;
      }
    </style>
    <link rel="stylesheet" href="./dist/bundle.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-medteal-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./dist/bundle.js"></script>
  </body>
</html>
